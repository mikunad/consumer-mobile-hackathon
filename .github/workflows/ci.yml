name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Allow the unprivileged network namespace the backend runner requires
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: env -i PATH="$PATH" HOME="$HOME" npm run test:backend
